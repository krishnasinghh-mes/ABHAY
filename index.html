<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABHAY: Ambulance Priority Explainer</title>
<style>
:root{--bg:#e8edf3;--fg:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#f1f5f9}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#f1f5f9}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#stage{position:relative;width:min(100vw,calc((100vh - 70px)*16/9));aspect-ratio:16/9;background:#0b1220;overflow:hidden;border-radius:10px}
svg{width:100%;height:100%;display:block}
#sub{position:absolute;left:5%;right:5%;bottom:3.5%;text-align:center;color:#fff;font-size:clamp(13px,2.5vw,30px);font-weight:600;line-height:1.3;background:rgba(2,6,23,.72);padding:.45em .8em;border-radius:8px;transition:opacity .3s}
#chip{position:absolute;top:3.5%;left:3%;background:#f59e0b;color:#1c1303;font-weight:700;font-size:clamp(12px,2.2vw,26px);padding:.3em .8em;border-radius:999px;transition:opacity .3s}
#intro{position:absolute;inset:0;background:rgba(2,6,23,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vw;text-align:center}
#intro h1{margin:0;font-size:clamp(28px,7vw,86px);letter-spacing:.04em}
#intro p{margin:0;font-size:clamp(12px,2vw,24px);color:#cbd5e1}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:.6em 1.6em;background:#ef4444;color:#fff;cursor:pointer;font-size:clamp(14px,2.2vw,24px)}
button:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}
#bar{display:flex;gap:16px;align-items:center;font-size:14px}
#bar button{font-size:14px;padding:.45em 1.1em;background:#334155}
</style></head><body>
<div id="stage">
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<rect width="1280" height="720" fill="#1d5c3f"/>
<rect x="560" width="160" height="720" fill="#2b2f36"/><rect y="280" width="1280" height="160" fill="#2b2f36"/>
<g stroke="#e5e7eb" stroke-width="3" stroke-dasharray="26 22" opacity=".7"><line x1="640" y1="0" x2="640" y2="280"/><line x1="640" y1="440" x2="640" y2="720"/><line x1="0" y1="360" x2="560" y2="360"/><line x1="720" y1="360" x2="1280" y2="360"/></g>
<g stroke="#fff" stroke-width="5"><line x1="642" y1="452" x2="718" y2="452"/><line x1="548" y1="282" x2="548" y2="358"/></g>
<g><rect x="380" y="20" width="160" height="95" rx="8" fill="#f8fafc"/><rect x="445" y="34" width="30" height="10" fill="#dc2626"/><rect x="455" y="24" width="10" height="30" fill="#dc2626" transform="translate(0,6)"/><text x="460" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">HOSPITAL</text></g>
<g id="cross"></g><g id="sigs"></g><g id="queue"></g>
<g id="rings" fill="none" stroke="#4ade80" stroke-width="4"><circle id="w0" cx="680" cy="600" r="0"/><circle id="w1" cx="680" cy="600" r="0"/><circle id="w2" cx="680" cy="600" r="0"/></g>
<line id="link" x1="700" y1="635" x2="788" y2="486" stroke="#4ade80" stroke-width="4" stroke-dasharray="10 8" opacity="0"/>
<line id="path" x1="680" y1="450" x2="680" y2="60" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390" opacity=".55"/>
<g id="amb"><rect x="-22" y="-42" width="44" height="84" rx="9" fill="#fff"/><rect x="-14" y="-30" width="28" height="14" rx="3" fill="#93c5fd"/><rect x="-4" y="2" width="8" height="26" fill="#dc2626"/><rect x="-13" y="11" width="26" height="8" fill="#dc2626"/><circle id="l1" cx="-10" cy="-2" r="5"/><circle id="l2" cx="10" cy="-2" r="5"/><circle id="ant" cx="0" cy="-40" r="6" fill="#4ade80" opacity="0"/></g>
<g id="rx"><rect x="775" y="470" width="30" height="30" rx="5" fill="#1e3a8a" id="rxb"/><text x="790" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RX</text><text x="790" y="520" text-anchor="middle" font-size="14" fill="#fff">nRF24L01 + ESP32</text></g>
<g id="timer" opacity="0"><rect x="745" y="540" width="240" height="50" rx="25" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><text id="tv" x="865" y="575" text-anchor="middle" font-size="26" font-weight="700" fill="#fbbf24">120 s</text></g>
<g id="btn" opacity="0"><rect x="40" y="440" width="270" height="150" rx="14" fill="#0f172a" stroke="#475569" stroke-width="3"/><text x="175" y="468" text-anchor="middle" font-size="16" fill="#cbd5e1">BUZZER + EMERGENCY SWITCH</text><circle id="bc" cx="175" cy="520" r="30" fill="#7f1d1d"/><text id="bt" x="175" y="575" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">Emergency Mode OFF</text></g>
<rect id="dim" width="1280" height="720" fill="#020617" opacity="0"/>
<g id="cards" opacity="0">
<text x="640" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">ESP32 compares the ID with its authorized list</text>
<text x="640" y="195" text-anchor="middle" font-size="22" fill="#cbd5e1">Authorized list includes ABHAY26</text>
<g id="ok" opacity="0"><rect x="170" y="250" width="400" height="230" rx="18" fill="#14532d" stroke="#4ade80" stroke-width="4"/><text x="370" y="335" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">ABHAY26</text><text x="370" y="415" text-anchor="middle" font-size="64" fill="#4ade80">✔</text><text x="370" y="460" text-anchor="middle" font-size="22" fill="#fff">Valid: priority given</text></g>
<g id="no" opacity="0"><rect x="710" y="250" width="400" height="230" rx="18" fill="#7f1d1d" stroke="#f87171" stroke-width="4"/><text x="910" y="335" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">ABHAY99</text><text x="910" y="415" text-anchor="middle" font-size="64" fill="#f87171">✘</text><text x="910" y="460" text-anchor="middle" font-size="22" fill="#fff">Unknown: ignored</text></g></g>
<text id="tag" x="640" y="330" text-anchor="middle" font-size="64" font-weight="700" fill="#fff" opacity="0" stroke="#020617" stroke-width="8" paint-order="stroke">ABHAY (अभय): fearless and safe</text>
</svg>
<div id="chip" style="opacity:0"></div>
<div id="intro"><h1>ABHAY (अभय)</h1><p>Ambulance Based Highway Automation System · Aavishkar 2026–27</p><button id="go">Play</button></div>
</div>
<div id="bar"><button id="fs">Fullscreen</button></div>
<script>
const $=id=>document.getElementById(id),T=45,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ramp=(t,a,b)=>cl((t-a)/(b-a));
const CH=[[0,"Stuck in traffic · buzzer ON"],[5,"ID ABHAY26 sent to the signal"],[14,"ID matches the authorized list"],[22,"Nearby signals: yellow, then red"],[27,"Wait cut: 120 s → 30 s"],[32,"Ambulance passes"],[40,"Back to normal, traffic moves on"]];
function sig(id,x,y){return `<g id="${id}"><rect x="${x}" y="${y}" width="24" height="62" rx="6" fill="#111827"/><circle cx="${x+12}" cy="${y+12}" r="8"/><circle cx="${x+12}" cy="${y+31}" r="8"/><circle cx="${x+12}" cy="${y+50}" r="8"/></g>`}
$('sigs').innerHTML=sig('sA',735,455)+sig('sC',524,215);
function setSig(id,s){const c=$(id).querySelectorAll('circle');c[0].setAttribute('fill',s=='r'?'#ef4444':'#3f1d1d');c[1].setAttribute('fill',s=='y'?'#facc15':'#3f3a12');c[2].setAttribute('fill',s=='g'?'#22c55e':'#12351f')}
const COL=['#f59e0b','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316'];
const vcar=(id,c)=>`<g id="${id}"><rect x="-20" y="-35" width="40" height="70" rx="9" fill="${c}"/><rect x="-14" y="-22" width="28" height="15" rx="4" fill="#bfdbfe"/></g>`;
$('queue').innerHTML=vcar('q1','#e11d48')+vcar('q2','#0ea5e9')+vcar('q3','#a3e635');
$('amb').insertAdjacentHTML('beforeend','<g id="bz" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"><path d="M30 -12 q10 14 0 28"/><path d="M40 -22 q18 24 0 48"/></g>');
const xs=[];for(let i=0;i<6;i++){xs.push(i*230-100);$('cross').insertAdjacentHTML('beforeend',`<g id="x${i}"><rect x="-35" y="-20" width="70" height="40" rx="9" fill="${COL[i]}"/><rect x="8" y="-14" width="15" height="28" rx="4" fill="#bfdbfe"/></g>`)}
let t=0,on=false,last=0,sc=-1;
const sm=p=>p*p*(3-2*p),set=(id,x,y)=>$(id).setAttribute('transform',`translate(${x},${y})`);
function mult(t){return t<22.5?1:t<25?1-(t-22.5)/2.5:t<40?0:cl((t-40)/1.2)}
function draw(t,dt){
 const m=mult(t),ord=xs.map((x,i)=>i).sort((a,b)=>xs[b]-xs[a]);let ahead=null;
 for(const i of ord){let x=xs[i],nx=x+130*dt*(x>=500?1:m);if(nx<500)nx=Math.min(nx,490,ahead===null?1e9:ahead-90);if(nx>1330)nx=-80;xs[i]=nx;ahead=nx;set('x'+i,nx,400)}
 const e=sm(ramp(t,32,39.5))*600,a=sm(ramp(t,0,4.5)),ay=760-125*a-e;
 set('q1',680,475-e);set('q2',680,550-e);set('amb',680,ay);set('q3',680,900-185*sm(ramp(t,2.5,6.5))-e);
 const f=Math.floor(t*6)%2;$('l1').setAttribute('fill',f?'#ef4444':'#3b82f6');$('l2').setAttribute('fill',f?'#3b82f6':'#ef4444');
 $('bz').setAttribute('opacity',t<36?.55+.45*Math.sin(t*12):0);
 const act=t>4.5&&t<31.5;$('ant').setAttribute('opacity',act?.6+.4*Math.sin(t*10):0);
 for(let k=0;k<3;k++){const ph=(((t-4.5)*.55-k/3)%1+1)%1,w=$('w'+k);w.setAttribute('cy',ay);w.setAttribute('r',act?20+ph*230:0);w.setAttribute('opacity',(1-ph)*.85)}
 $('link').setAttribute('opacity',ramp(t,8,9)*(1-ramp(t,14,15))*.9);
 const rg=t>8&&t<31.5;$('rxb').setAttribute('fill',rg?'#2563eb':'#1e3a8a');$('rxb').setAttribute('stroke',rg?'#93c5fd':'none');$('rxb').setAttribute('stroke-width',4);
 $('btn').setAttribute('opacity',ramp(t,.3,.9)*(1-ramp(t,5,5.8)));$('bc').setAttribute('fill','#ef4444');$('bt').textContent='EMERGENCY MODE ON';
 const d=.62*Math.min(ramp(t,14,14.8),1-ramp(t,21,21.8));$('dim').setAttribute('opacity',d);
 $('cards').setAttribute('opacity',Math.min(ramp(t,14.2,14.9),1-ramp(t,21,21.8)));$('ok').setAttribute('opacity',ramp(t,15,15.8));$('no').setAttribute('opacity',ramp(t,18,18.8));
 $('timer').setAttribute('opacity',ramp(t,26.5,27)*(1-ramp(t,31.5,32)));
 $('tv').textContent=Math.round(t<28?120-90*ramp(t,27,28):30*(1-ramp(t,28,31.5)))+' s';
 setSig('sC',t<22.5?'g':t<25?'y':t<40?'r':'g');setSig('sA',t>=31.5&&t<40?'g':'r');
 $('tag').setAttribute('opacity',ramp(t,42,43.5));
 let k=0;CH.forEach((c,i)=>{if(t>=c[0])k=i});if(k!==sc){sc=k;$('chip').textContent=CH[k][1];$('chip').style.opacity=1}
}
function frame(now){if(!on)return;const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;draw(t,dt);if(t>=T){on=false;$('go').textContent='Replay';$('intro').style.display='flex';$('intro').style.background='rgba(2,6,23,.55)';return}requestAnimationFrame(frame)}
$('go').onclick=()=>{t=0;sc=-1;for(let i=0;i<6;i++)xs[i]=i*230-100;$('intro').style.display='none';on=true;last=performance.now();requestAnimationFrame(frame)};
$('fs').onclick=()=>{const s=$('stage');try{s.requestFullscreen&&s.requestFullscreen()}catch(e){}};
draw(0,0);
</script></body></html>
